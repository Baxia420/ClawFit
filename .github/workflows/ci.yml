name: Repository checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm openclaw:plugin:validate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:library:browser
        env:
          CLAWFIT_SCREENSHOT_DIR: test-results/exercise-library
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exercise-library-screenshots
          path: test-results/exercise-library
          if-no-files-found: ignore
