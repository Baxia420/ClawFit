services:
  - type: web
    name: claw-fit-api
    runtime: node
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @clawfit/api build
    startCommand: pnpm --filter @clawfit/api start
    healthCheckPath: /ready
    envVars:
      - key: NODE_VERSION
        value: 24.15.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_TIMEZONE
        value: Asia/Kuala_Lumpur
      - key: DATABASE_URL
        sync: false
      - key: HEALTH_API_WEB_TOKEN
        sync: false
      - key: HEALTH_API_OPENCLAW_TOKEN
        sync: false
      - key: CLAWFIT_WHATSAPP_ALLOWED_GROUP_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NUTRITION_MODEL_PRIMARY
        sync: false
      # Configure NUTRITION_MODEL_FALLBACK only when a verified fallback model is present in .model-smoke.json
      # - key: NUTRITION_MODEL_FALLBACK
      #   sync: false

