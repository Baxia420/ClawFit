services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: clawfit
      POSTGRES_USER: clawfit
      POSTGRES_PASSWORD: clawfit
    ports:
      - "5432:5432"
    volumes:
      - clawfit-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawfit -d clawfit"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clawfit-postgres:

